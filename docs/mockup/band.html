<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maquette – SobieGroup Claude Limit Meter</title>
  <!--
    Maquette servant à produire les images du README : elle reprend les textes,
    les jauges et la logique d'affichage de hooks/register.tsx.
    Paramètres d'URL : theme=dark, five=62, week=34, overflow=10, on=1
  -->
  <style>
    :root {
      --bg: #faf9f5; --panel: #ffffff; --text: #1f1e1d; --muted: #73726c; --border: rgba(31,30,29,.13);
      --bubble: #f0eee6; --success: #2c8a5b; --warning: #b7791f; --error: #c94040; --accent: #c96442;
      --btn: rgba(31,30,29,.05);
    }
    html.dark {
      --bg: #262624; --panel: #30302e; --text: #f5f4ef; --muted: #a8a69f; --border: rgba(255,255,255,.12);
      --bubble: #1f1e1d; --success: #4fb37f; --warning: #e0a83a; --error: #e06060; --btn: rgba(255,255,255,.06);
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; background: var(--bg); color: var(--text); font: 15px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
    .chat { flex: 1; max-width: 820px; width: 100%; margin: 0 auto; padding: 26px 16px 0; }
    .user { margin-left: auto; width: fit-content; max-width: 75%; background: var(--bubble); padding: 9px 14px; border-radius: 12px; margin-bottom: 16px; }
    .bot p { margin: 0 0 8px; }
    .tool { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; border: 1px solid var(--border); border-radius: 8px; padding: 3px 10px; margin-bottom: 8px; }
    code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; background: var(--bubble); padding: 1px 5px; border-radius: 4px; }
    .bottom { max-width: 820px; width: 100%; margin: 0 auto 22px; padding: 0 16px; }

    .band { display: flex; flex-wrap: wrap; align-items: center; column-gap: 26px; row-gap: 8px; padding: 10px 14px; margin-bottom: 8px; border-radius: 12px; background: var(--panel); font-size: 13px; }
    .gauge { display: flex; flex-direction: column; width: 160px; }
    .gauge .head { display: flex; justify-content: space-between; font-weight: 600; }
    .gauge svg { display: block; margin: 3px 0 2px; }
    .muted { color: var(--muted); font-size: 12px; }
    .buttons { display: flex; gap: 8px; align-items: center; margin-left: 4px; }
    .btn { border: 1px solid var(--border); background: var(--btn); color: var(--text); border-radius: 8px; padding: 5px 11px; font: inherit; font-weight: 600; white-space: nowrap; }
    .btn.primary { background: var(--text); border-color: var(--text); color: var(--bg); }
    .composer { border: 1px solid var(--border); border-radius: 16px; background: var(--panel); padding: 13px 16px 10px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    .placeholder { color: var(--muted); min-height: 26px; }
    .tools { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--muted); font-size: 13px; }
    .send { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 17px; }
  </style>
</head>
<body>
  <div class="chat">
    <div class="user">Ajoute la pagination à l'API des commandes et écris les tests.</div>
    <div class="bot">
      <div class="tool">✎ Modifié <code>src/api/orders.ts</code></div>
      <div class="tool">▶ Exécuté <code>npm test</code></div>
      <p>La pagination est en place (<code>?page</code> et <code>?limit</code>, 50 par défaut). Les 12 tests passent.</p>
    </div>
  </div>
  <div class="bottom">
    <div class="band" id="band"></div>
    <div class="composer">
      <div class="placeholder">Répondez…</div>
      <div class="tools"><span>＋ &nbsp; Opus 5.5 · Auto</span><span class="send">↑</span></div>
    </div>
  </div>

  <script>
    // Même logique d'affichage que hooks/register.tsx.
    const q = new URLSearchParams(location.search);
    if (q.get("theme") === "dark") document.documentElement.classList.add("dark");
    const five = Number(q.get("five") ?? 62), week = Number(q.get("week") ?? 34);
    const overflowPct = Number(q.get("overflow") ?? 10), enabled = q.get("on") === "1";
    const limit = 100 + (enabled ? overflowPct : 0);
    const color = p => p >= Math.min(100, limit) ? "var(--error)" : p >= 70 ? "var(--warning)" : "var(--success)";
    const hex = p => p >= Math.min(100, limit) ? "#e5534b" : p >= 70 ? "#e0a83a" : "#3fb27f";
    const fmt = p => p < 10 ? p.toFixed(1) + " %" : Math.round(p) + " %";
    const bar = p => {
      const W = 160, fill = p > 0 ? Math.max(6, Math.min(1, p / limit) * W) : 0;
      const mark = limit > 100 ? `<rect x="${(100 / limit) * W - 1}" y="0" width="2" height="10" rx="1" fill="#8b8a85"/>` : "";
      return `<svg width="${W}" height="10"><rect x="0" y="2" width="${W}" height="6" rx="3" fill="#8b8a85" fill-opacity=".25"/>` +
        (fill ? `<rect x="0" y="2" width="${fill}" height="6" rx="3" fill="${hex(p)}"/>` : "") + mark + `</svg>`;
    };
    const gauge = (label, p, detail) =>
      `<div class="gauge"><div class="head"><span>${label}</span><span style="color:${color(p)}">${fmt(p)}</span></div>${bar(p)}<span class="muted">${detail}</span></div>`;
    const worst = Math.max(five, week);
    let badge;
    if (!enabled) badge = `<span class="muted" style="font-weight:600">désactivé</span>`;
    else if (worst < 100) badge = `<span style="color:var(--warning)">+${overflowPct} % possible</span>`;
    else { const left = Math.max(0, Math.round(100 + overflowPct - worst)); badge = `<span style="color:${left > 0 ? "var(--warning)" : "var(--error)"}">+${left} % restant</span>`; }
    document.getElementById("band").innerHTML =
      gauge("Limite 5 h", five, "reset dans 2 h 13") +
      gauge("Limite semaine", week, "reset dans 4 j 6 h") +
      `<span class="buttons"><button class="btn">Dépassement de la limite ${badge}</button><button class="btn primary">Finir le prompt</button></span>`;
  </script>
</body>
</html>
